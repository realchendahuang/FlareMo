# 自托管 fork / 部署仓库的手动生产部署模板。
#
# 这是模板而不是上游仓库的 workflow：复制到部署仓库的
#   .github/workflows/deploy-cloudflare.yml
# 然后在 Actions 里手动 Run workflow。只响应 workflow_dispatch，不在 push 时发布；
# 上游 realchendahuang/FlareMo 不会执行这个 job。
# 真正执行的仍是仓库里的 pnpm deploy：构建前端、Worker bundle dry-run、应用远端 D1 migration、再 wrangler deploy。
name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, wrangler dry-run, and read-only resource check; skip D1 migration, publish, and secret sync"
        required: false
        type: boolean
        default: false
      provision:
        description: "Create missing D1, R2, Queue, and Vectorize resources"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: flaremo-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository != 'realchendahuang/FlareMo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write wrangler.jsonc
        env:
          WRANGLER_JSONC: ${{ secrets.WRANGLER_JSONC }}
          FLAREMO_D1_DATABASE_ID: ${{ secrets.FLAREMO_D1_DATABASE_ID }}
          FLAREMO_PUBLIC_URL: ${{ vars.FLAREMO_PUBLIC_URL || secrets.FLAREMO_PUBLIC_URL }}
          FLAREMO_DEPLOY_REPOSITORY: ${{ vars.FLAREMO_DEPLOY_REPOSITORY }}
        run: node ./scripts/write-wrangler-config.mjs

      - name: Provision / verify Cloudflare resources
        run: |
          set -euo pipefail
          if [[ "${{ inputs.provision }}" == "true" && "${{ inputs.dry_run }}" != "true" ]]; then
            pnpm provision:remote
          else
            pnpm provision:remote -- --check
          fi

      - name: Deploy
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            pnpm deploy:dry-run
          else
            pnpm deploy
          fi

      - name: Sync Worker secrets
        if: ${{ inputs.dry_run != true }}
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          FLAREMO_BOOTSTRAP_SECRET: ${{ secrets.FLAREMO_BOOTSTRAP_SECRET }}
        run: pnpm secrets:sync

      - name: Smoke check deployed site
        if: ${{ inputs.dry_run != true }}
        run: pnpm smoke:check
