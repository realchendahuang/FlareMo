# 本机有 JDK 21 与 27 两套；Gradle 默认会挑 27，AGP/Kotlin 会在 27 上炸。
# 这台机器是单机开发环境，所以直接把 JDK 钉在这里（换机器时改这一行）。
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Homebrew 的 JDK 打 jpackage 包时 Compose 插件会拦一道（它没经过 Apple 的
# 官方分发验证）。本机先用它打包验证链路；正式发布建议换成 Corretto/Temurin。
compose.desktop.packaging.checkJdkVendor=false
